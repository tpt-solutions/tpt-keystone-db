[package]
name = "tpt-keystone-canvas"
version = "0.1.0"
edition = "2021"
description = "TPT Canvas — the data-aware frontend framework for TPT Keystone (Rust -> WASM)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-keystone-db"
documentation = "https://github.com/tpt-solutions/tpt-keystone-db#readme"
readme = "README.md"
keywords = ["wasm", "webassembly", "frontend", "dashboard", "data-visualization"]
categories = ["wasm", "web-programming"]
rust-version = "1.85"

[lib]
name = "tpt_canvas"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tsgen"
path = "src/bin/tsgen.rs"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "MouseEvent",
    "WheelEvent",
    "Event",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "HtmlDocument",
    "HtmlHeadElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "console",
    # WebGPU proof-of-concept (`webgpu.rs`, `CanvasTimeSeries` only) — these
    # bindings are gated behind wasm-bindgen's "unstable APIs" opt-in, see
    # `.cargo/config.toml`'s `--cfg=web_sys_unstable_apis`.
    "Navigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuQueue",
    "GpuCanvasContext",
    "GpuCanvasConfiguration",
    "GpuTextureFormat",
    "GpuShaderModule",
    "GpuShaderModuleDescriptor",
    "GpuVertexState",
    "GpuFragmentState",
    "GpuColorTargetState",
    "GpuPrimitiveState",
    "GpuPrimitiveTopology",
    "GpuVertexBufferLayout",
    "GpuVertexAttribute",
    "GpuVertexFormat",
    "GpuVertexStepMode",
    "GpuRenderPipelineDescriptor",
    "GpuRenderPipeline",
    "GpuAutoLayoutMode",
    "GpuBufferDescriptor",
    "GpuBuffer",
    "GpuCommandEncoder",
    "GpuRenderPassDescriptor",
    "GpuRenderPassColorAttachment",
    "GpuRenderPassEncoder",
    "GpuLoadOp",
    "GpuStoreOp",
    "GpuTexture",
    "GpuTextureView",
    "GpuCommandBuffer",
]

# `tsgen` (Part 2) speaks a hand-rolled HTTP GET over `std::net::TcpStream`
# against `/schema` on the host target — same "no HTTP client crate" ethos as
# `tpt-keystone`'s own wire code, and it avoids dragging a reqwest-style
# dependency into a crate whose main build target is the browser.
